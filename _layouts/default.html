<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <a class="site-header__name" href="{{ '/' | relative_url }}">Cristhian Delgado</a>
    <nav class="site-header__nav">
      <a href="{{ '/' | relative_url }}#projects">Projects</a>
      <a href="https://github.com/crackbandicoot-dot" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:{{ site.email }}">Email</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>Built with Jekyll · Markdown in, site out</span>
    <a href="https://github.com/crackbandicoot-dot" target="_blank" rel="noopener">github.com/crackbandicoot-dot</a>
    <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </footer>

</body>
</html>
